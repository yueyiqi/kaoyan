services:
  kaoyan-english-hub:
    build: .
    image: kaoyan-english-hub:schema-v5
    container_name: kaoyan-english-hub
    restart: unless-stopped
    environment:
      KAOYAN_PORT: ${KAOYAN_PORT:?Set the allocated application port}
    ports:
      - "${KAOYAN_BIND_HOST:-127.0.0.1}:${KAOYAN_PORT}:${KAOYAN_PORT}"
    volumes:
      - ./db_volume:/data/db:rw
      - ./db_backups:/data/backups:rw
