<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="softCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <style>
      .t-page-cn { font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif; font-size:28px; font-weight:800; fill:#0f172a; letter-spacing:-0.5px; }
      .t-page-en { font-family:"SF Pro Text","Helvetica Neue",Arial,sans-serif; font-size:13.5px; font-weight:500; fill:#94a3b8; }
      .c-title    { font-family:"PingFang SC",sans-serif; font-size:17px; font-weight:800; fill:#0f172a; }
      .c-subtitle { font-family:"SF Pro Text",Arial,sans-serif; font-size:11.5px; font-weight:500; fill:#475569; }
      .badge-t    { font-family:"PingFang SC",sans-serif; font-size:11.5px; font-weight:700; }
      .m-lbl      { font-family:"PingFang SC",sans-serif; font-size:11.5px; font-weight:500; fill:#475569; }
      .m-val      { font-family:"PingFang SC","SF Pro Display",sans-serif; font-size:18px; font-weight:800; }
      .i-pfx      { font-family:"PingFang SC",sans-serif; font-size:13px; font-weight:700; fill:#0f172a; }
      .i-desc     { font-family:"PingFang SC",sans-serif; font-size:12.5px; font-weight:400; fill:#475569; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect x="24" y="24" width="1552" height="912" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- 页面主标题栏 -->
  <g transform="translate(60, 68)">
    <text x="0" y="0" class="t-page-cn">Windows 视角 SSH 免密登录与 Git 发布框架 — UML 互动泳道图及五大可视化大典</text>
    <text x="0" y="32" class="t-page-en">Windows-Centric SSH ED25519 Passwordless Auth &amp; VS Code Git Auto-Deploy: UML Swimlane, Sequence &amp; Key-Lock Topology</text>
    <line x1="0" y1="52" x2="1480" y2="52" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <!-- Card: 一、Windows 视角四泳道互动流程图 (Swimlane) -->
  <g transform="translate(60, 130)">
    <rect width="726" height="371" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#softCardShadow)"/>
    <path d="M 0 12 Q 0 0 12 0 L 714 0 Q 726 0 726 12 L 726 62 L 0 62 Z" fill="#f4f7fe"/>
    <line x1="0" y1="62" x2="726" y2="62" stroke="#2563eb" stroke-width="1" stroke-opacity="0.3"/>
    <text x="24" y="27" class="c-title">一、Windows 视角四泳道互动流程图 (Swimlane)</text>
    <text x="24" y="47" class="c-subtitle">Win SSH Config / Win VS Code &amp; Git / Alibaba Cloud Elena / GitHub</text>
    <rect x="530" y="17" width="176" height="26" rx="13" fill="#e4ecfc"/>
    <text x="618" y="34" text-anchor="middle" class="badge-t" fill="#1945a4">纯 Windows 研发视角</text>
    <rect x="20" y="74" width="686" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="36" y="92" class="m-lbl">核心交互泳道</text>
    <text x="36" y="118" class="m-val" fill="#2563eb">4 泳道 (Win终端/VSCode/阿里云/GH)</text>
    <line x1="363" y1="82" x2="363" y2="128" stroke="#e2e8f0" stroke-width="1"/>
    <text x="379" y="92" class="m-lbl">代码推送上线耗时</text>
    <text x="379" y="118" class="m-val" fill="#2563eb">&lt;= 3.0 秒 (自动同步重启)</text>
    <circle cx="32" cy="152" r="4" fill="#2563eb"/>
    <text x="46" y="156"><tspan class="i-pfx">泳道1 Win密钥与SSH: </tspan><tspan class="i-desc">本地持有 id_ed25519_codeup 私钥，通过 ~/.ssh/config 免密直连 ssh elena</tspan></text>
    <circle cx="32" cy="198" r="4" fill="#2563eb"/>
    <text x="46" y="202"><tspan class="i-pfx">泳道2 Win Git与VSCode: </tspan><tspan class="i-desc">MINGW64 克隆仓库至 D:\kaoyanEnglish，VS Code 改码后一键 git push</tspan></text>
    <circle cx="32" cy="244" r="4" fill="#2563eb"/>
    <text x="46" y="248"><tspan class="i-pfx">泳道3 阿里云 8.163.29.42: </tspan><tspan class="i-desc">elena 账号 authorized_keys 验签放行，post-receive / deploy-kaoyan 自动重启</tspan></text>
    <circle cx="32" cy="290" r="4" fill="#2563eb"/>
    <text x="46" y="294"><tspan class="i-pfx">泳道4 GitHub 代码中枢: </tspan><tspan class="i-desc">yueyiqi/kaoyan.git 同时绑定 Windows 公钥与阿里云公钥，实现双向免密闭环</tspan></text>
  </g>
  <!-- Card: 二、密码学挑战-应答时序图 (Sequence) -->
  <g transform="translate(814, 130)">
    <rect width="726" height="371" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#softCardShadow)"/>
    <path d="M 0 12 Q 0 0 12 0 L 714 0 Q 726 0 726 12 L 726 62 L 0 62 Z" fill="#f2f9f7"/>
    <line x1="0" y1="62" x2="726" y2="62" stroke="#059669" stroke-width="1" stroke-opacity="0.3"/>
    <text x="24" y="27" class="c-title">二、密码学挑战-应答时序图 (Sequence)</text>
    <text x="24" y="47" class="c-subtitle">Windows OpenSSH Client &lt;-&gt; Alibaba Cloud sshd (:22)</text>
    <rect x="538" y="17" width="168" height="26" rx="13" fill="#e1f2ed"/>
    <text x="622" y="34" text-anchor="middle" class="badge-t" fill="#036949">私钥永不出 Windows</text>
    <rect x="20" y="74" width="686" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="36" y="92" class="m-lbl">非对称签名算法</text>
    <text x="36" y="118" class="m-val" fill="#059669">OpenSSH ED25519 (256-bit)</text>
    <line x1="363" y1="82" x2="363" y2="128" stroke="#e2e8f0" stroke-width="1"/>
    <text x="379" y="92" class="m-lbl">私钥网络传输量</text>
    <text x="379" y="118" class="m-val" fill="#059669">0 Bytes (仅传签名值)</text>
    <circle cx="32" cy="152" r="4" fill="#059669"/>
    <text x="46" y="156"><tspan class="i-pfx">第1步 寻钥声明: </tspan><tspan class="i-desc">Windows 读取 ~/.ssh/config 锁定 id_ed25519_codeup 并向服务端声明公钥 ID</tspan></text>
    <circle cx="32" cy="198" r="4" fill="#059669"/>
    <text x="46" y="202"><tspan class="i-pfx">第2步 门禁质询: </tspan><tspan class="i-desc">阿里云 sshd 核对 /home/elena/.ssh/authorized_keys 命中公钥，下发随机 Nonce</tspan></text>
    <circle cx="32" cy="244" r="4" fill="#059669"/>
    <text x="46" y="248"><tspan class="i-pfx">第3步 本地签名: </tspan><tspan class="i-desc">Windows 用本地私钥对 (SessionID + Nonce) 签名，私钥文件绝不离开电脑</tspan></text>
    <circle cx="32" cy="290" r="4" fill="#059669"/>
    <text x="46" y="294"><tspan class="i-pfx">第4步 验签放行: </tspan><tspan class="i-desc">阿里云用公钥验签成功，开启 elena 会话并在 /var/log/auth.log 记录指纹</tspan></text>
  </g>
  <!-- Card: 三、『2把钥匙 vs 2道门禁』二分拓扑图 -->
  <g transform="translate(60, 529)">
    <rect width="726" height="371" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#softCardShadow)"/>
    <path d="M 0 12 Q 0 0 12 0 L 714 0 Q 726 0 726 12 L 726 62 L 0 62 Z" fill="#f8f5fe"/>
    <line x1="0" y1="62" x2="726" y2="62" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.3"/>
    <text x="24" y="27" class="c-title">三、『2把钥匙 vs 2道门禁』二分拓扑图</text>
    <text x="24" y="47" class="c-subtitle">2 Outbound Private Keys (Win &amp; ECS) vs. 2 Inbound Locks (ECS &amp; GitHub)</text>
    <rect x="562" y="17" width="144" height="26" rx="13" fill="#efe7fc"/>
    <text x="634" y="34" text-anchor="middle" class="badge-t" fill="#5628a5">一秒讲清方向关系</text>
    <rect x="20" y="74" width="686" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="36" y="92" class="m-lbl">出站客户端私钥串</text>
    <text x="36" y="118" class="m-val" fill="#7c3aed">2 把钥匙 (Windows + 阿里云)</text>
    <line x1="363" y1="82" x2="363" y2="128" stroke="#e2e8f0" stroke-width="1"/>
    <text x="379" y="92" class="m-lbl">入站服务端门禁锁芯</text>
    <text x="379" y="118" class="m-val" fill="#7c3aed">2 道门禁 (阿里云 + GitHub)</text>
    <circle cx="32" cy="152" r="4" fill="#7c3aed"/>
    <text x="46" y="156"><tspan class="i-pfx">核心防混淆公理: </tspan><tspan class="i-desc">谁主动敲门 (ssh / git clone)，谁就掏自己本地的私钥；被连方只用公钥锁芯验签</tspan></text>
    <circle cx="32" cy="198" r="4" fill="#7c3aed"/>
    <text x="46" y="202"><tspan class="i-pfx">钥匙#1 (Windows私钥): </tspan><tspan class="i-desc">id_ed25519_codeup (OFeU8L1B...) -&gt; 同时开【阿里云门禁】与【GitHub门禁】</tspan></text>
    <circle cx="32" cy="244" r="4" fill="#7c3aed"/>
    <text x="46" y="248"><tspan class="i-pfx">钥匙#2 (阿里云私钥): </tspan><tspan class="i-desc">/home/elena/.ssh/id_ed25519 (1/zjU68N...) -&gt; 专门开【GitHub门禁】拉代码</tspan></text>
    <circle cx="32" cy="290" r="4" fill="#7c3aed"/>
    <text x="46" y="294"><tspan class="i-pfx">闭环效果: </tspan><tspan class="i-desc">Windows 可免密登阿里云、免密推 GitHub；阿里云也可免密从 GitHub 拉取更新</tspan></text>
  </g>
  <!-- Card: 四、五大互补可视化方式与排障决策树 -->
  <g transform="translate(814, 529)">
    <rect width="726" height="371" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" filter="url(#softCardShadow)"/>
    <path d="M 0 12 Q 0 0 12 0 L 714 0 Q 726 0 726 12 L 726 62 L 0 62 Z" fill="#fdf6f2"/>
    <line x1="0" y1="62" x2="726" y2="62" stroke="#ea580c" stroke-width="1" stroke-opacity="0.3"/>
    <text x="24" y="27" class="c-title">四、五大互补可视化方式与排障决策树</text>
    <text x="24" y="47" class="c-subtitle">5 Complementary Visual Paradigms &amp; Permission-Denied Decision Tree</text>
    <rect x="541" y="17" width="165" height="26" rx="13" fill="#fceae1"/>
    <text x="624" y="34" text-anchor="middle" class="badge-t" fill="#a33d08">实战排障 100% 命中</text>
    <rect x="20" y="74" width="686" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="36" y="92" class="m-lbl">最佳可视化组合</text>
    <text x="36" y="118" class="m-val" fill="#ea580c">泳道 + 二分 + 时序 + 决策 + 沙盒</text>
    <line x1="363" y1="82" x2="363" y2="128" stroke="#e2e8f0" stroke-width="1"/>
    <text x="379" y="92" class="m-lbl">Windows 高频坑点</text>
    <text x="379" y="118" class="m-val" fill="#ea580c">4 类报错秒级定位</text>
    <circle cx="32" cy="152" r="4" fill="#ea580c"/>
    <text x="46" y="156"><tspan class="i-pfx">坑点1 私钥非默认名: </tspan><tspan class="i-desc">私钥叫 id_ed25519_codeup -&gt; 需在 Windows ~/.ssh/config 配 IdentityFile</tspan></text>
    <circle cx="32" cy="198" r="4" fill="#ea580c"/>
    <text x="46" y="202"><tspan class="i-pfx">坑点2 Windows权限过宽: </tspan><tspan class="i-desc">报 UNPROTECTED PRIVATE KEY -&gt; 用 PowerShell icacls 收敛为当前用户只读</tspan></text>
    <circle cx="32" cy="244" r="4" fill="#ea580c"/>
    <text x="46" y="248"><tspan class="i-pfx">坑点3 公钥首部漏字母: </tspan><tspan class="i-desc">粘贴漏 s 变 sh-ed25519 -&gt; 服务端用 ssh-keygen -lf 校验指纹排雷</tspan></text>
    <circle cx="32" cy="290" r="4" fill="#ea580c"/>
    <text x="46" y="294"><tspan class="i-pfx">坑点4 服务器拉取GitHub: </tspan><tspan class="i-desc">在 ssh elena 内拉 GitHub -&gt; 需将服务器自身 id_ed25519.pub 录入 GitHub</tspan></text>
  </g>
</svg>