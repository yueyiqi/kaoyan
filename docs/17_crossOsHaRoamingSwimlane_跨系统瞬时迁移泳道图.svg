<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1240" width="100%" preserveAspectRatio="xMidYMid meet"><rect width="1800" height="1240" fill="#f8fafc" /><text x="60" y="65" font-size="35" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif">跨系统在线切主：已部署与实测 (Cross-OS Live Switchover)</text><text x="60" y="108" font-size="22" fill="#475569" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif">生产库 18 表；S1 经用户授权替代 M1 · 18 production tables; native Windows / Linux / macOS</text><text x="60" y="150" font-size="22" fill="#475569" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif">示例：W1 执行主，HP 协调入口；生产最终主节点 HP (Example: W1 primary; final primary HP)</text><text x="210" y="224" font-size="27" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif">客户端 / Client</text><text x="210" y="260" font-size="21" fill="#475569" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif">同一 HTTPS 入口</text><line x1="210" x2="210" y1="280" y2="970" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7" /><text x="660" y="224" font-size="27" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif">HP / Linux</text><text x="660" y="260" font-size="21" fill="#475569" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif">协调器 + 本地副本</text><line x1="660" x2="660" y1="280" y2="970" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7" /><text x="1110" y="224" font-size="27" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif">W1 / Windows</text><text x="1110" y="260" font-size="21" fill="#475569" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif">原生 SQL 执行主示例</text><line x1="1110" x2="1110" y1="280" y2="970" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7" /><text x="1560" y="224" font-size="27" fill="#1d4ed8" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif">S1 / macOS</text><text x="1560" y="260" font-size="21" fill="#475569" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif">原生完整副本</text><line x1="1560" x2="1560" y1="280" y2="970" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7" /><text x="390" y="315" font-size="23" fill="#2563eb" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif">1. POST + 同一请求键 (Stable request key)</text><line x1="210" x2="660" y1="350" y2="350" stroke="#2563eb" stroke-width="4" /><polygon points="660,350 642,341 642,359" fill="#2563eb" /><text x="390" y="435" font-size="23" fill="#059669" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif">2. epoch 校验 + 整请求事务 (Fence + atomic transaction)</text><line x1="660" x2="1110" y1="470" y2="470" stroke="#059669" stroke-width="4" /><polygon points="1110,470 1092,461 1092,479" fill="#059669" /><text x="390" y="555" font-size="23" fill="#7c3aed" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif">3. 完整快照 + 回执 (Snapshot + response receipt)</text><line x1="1110" x2="660" y1="590" y2="590" stroke="#7c3aed" stroke-width="4" /><polygon points="660,590 678,581 678,599" fill="#7c3aed" /><text x="390" y="675" font-size="23" fill="#b45309" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif">4. 内容与结构校验；至少两机确认 (Verify + 2 ACKs)</text><line x1="660" x2="1560" y1="710" y2="710" stroke="#b45309" stroke-width="4" /><polygon points="1560,710 1542,701 1542,719" fill="#b45309" /><text x="390" y="795" font-size="23" fill="#2563eb" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif">5. 持久化后返回成功 (Reply only after durable ACKs)</text><line x1="660" x2="210" y1="830" y2="830" stroke="#2563eb" stroke-width="4" /><polygon points="210,830 228,821 228,839" fill="#2563eb" /><text x="60" y="938" font-size="24" fill="#0f172a" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif">切主：排队 → 持久化新主及任期 → 校验副本 → 重放未确认请求 → 继续同入口写入</text><rect x="60" y="985" width="1680" height="170" rx="18" fill="#fff7ed" stroke="#fed7aa" /><text x="88" y="1029" font-size="25" fill="#9a3412" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif">实际通过：公网 HP→W1→S1→HP；跨机隧道中断；W1 缺表恢复；全部历史行保留</text><text x="88" y="1071" font-size="23" fill="#9a3412" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif">边界：首次迁入冻结 24.79 秒；后续切主为秒级；少于两个副本时拒绝确认；HP 协调器仍是单点</text><text x="88" y="1113" font-size="20" fill="#9a3412" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif">Verified native paths; initial freeze 24.79s; seconds per switch; single coordinator remains a dependency</text><text x="60" y="1202" font-size="19" fill="#64748b" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, sans-serif">Evidence: ev-0021 / ev-0023 / ev-0029 · srbg10 / Codex · 2026-10-24</text></svg>