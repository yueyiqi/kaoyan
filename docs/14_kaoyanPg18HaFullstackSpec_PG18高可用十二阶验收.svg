<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="softCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <style>
      .t-page-cn { font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif; font-size:28px; font-weight:800; fill:#0f172a; letter-spacing:-0.5px; }
      .t-page-en { font-family:"SF Pro Text","Helvetica Neue",Arial,sans-serif; font-size:13.5px; font-weight:500; fill:#94a3b8; }
      .c-title    { font-family:"PingFang SC",sans-serif; font-size:17px; font-weight:800; fill:#0f172a; }
      .c-subtitle { font-family:"SF Pro Text",Arial,sans-serif; font-size:11.5px; font-weight:500; fill:#475569; }
      .badge-t    { font-family:"PingFang SC",sans-serif; font-size:11.5px; font-weight:700; }
      .m-lbl      { font-family:"PingFang SC",sans-serif; font-size:11.5px; font-weight:500; fill:#475569; }
      .m-val      { font-family:"PingFang SC","SF Pro Display",sans-serif; font-size:18px; font-weight:800; }
      .i-pfx      { font-family:"PingFang SC",sans-serif; font-size:13px; font-weight:700; fill:#0f172a; }
      .i-desc     { font-family:"PingFang SC",sans-serif; font-size:12.5px; font-weight:400; fill:#475569; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect x="24" y="24" width="1552" height="912" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- 页面主标题栏 -->
  <g transform="translate(60, 68)">
    <text x="0" y="0" class="t-page-cn">考研英语全栈 PG18 双擎高可用架构与十二阶工程验收大典</text>
    <text x="0" y="32" class="t-page-en">Full-Stack PG18 + SQLite WAL Dual-Engine HA · Middleware &amp; Frontend Verdict · 12-Stage Spec · 24/24 Acceptance</text>
    <line x1="0" y1="52" x2="1480" y2="52" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <!-- Card: 一、PG 18.6 主库 + SQLite 热备 + T2 冷备 -->
  <g transform="translate(60, 130)">
    <rect width="726" height="371" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#softCardShadow)"/>
    <path d="M 0 12 Q 0 0 12 0 L 714 0 Q 726 0 726 12 L 726 62 L 0 62 Z" fill="#f4f7fe"/>
    <line x1="0" y1="62" x2="726" y2="62" stroke="#2563eb" stroke-width="1" stroke-opacity="0.3"/>
    <text x="24" y="27" class="c-title">一、PG 18.6 主库 + SQLite 热备 + T2 冷备</text>
    <text x="24" y="47" class="c-subtitle">10-Table Schema &amp; Dual-Engine Active-Active HA (RPO=0, RTO&lt;5ms)</text>
    <rect x="536" y="17" width="170" height="26" rx="13" fill="#e4ecfc"/>
    <text x="621" y="34" text-anchor="middle" class="badge-t" fill="#1945a4">模块 1 · 数据高可用</text>
    <rect x="20" y="74" width="686" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="36" y="92" class="m-lbl">主备同步表数量</text>
    <text x="36" y="118" class="m-val" fill="#2563eb">10 / 10 表 (100% 同步)</text>
    <line x1="363" y1="82" x2="363" y2="128" stroke="#e2e8f0" stroke-width="1"/>
    <text x="379" y="92" class="m-lbl">故障切换与恢复</text>
    <text x="379" y="118" class="m-val" fill="#2563eb">RTO &lt; 5ms · RPO = 0</text>
    <circle cx="32" cy="152" r="4" fill="#2563eb"/>
    <text x="46" y="156"><tspan class="i-pfx">PG 18.6 主库: </tspan><tspan class="i-desc">128MB shared_buffers 低内存调优，承载并发事务与 4 大复合索引</tspan></text>
    <circle cx="32" cy="198" r="4" fill="#2563eb"/>
    <text x="46" y="202"><tspan class="i-pfx">SQLite WAL 热备: </tspan><tspan class="i-desc">同步双写 + PG 故障 &lt;5ms 零中断接管 + 恢复自动 WAL 追平</tspan></text>
    <circle cx="32" cy="244" r="4" fill="#2563eb"/>
    <text x="46" y="248"><tspan class="i-pfx">10 张受治核心表: </tspan><tspan class="i-desc">users / anchors / lexicon / passages / spans / vocab / essays / wal 等</tspan></text>
    <circle cx="32" cy="290" r="4" fill="#2563eb"/>
    <text x="46" y="294"><tspan class="i-pfx">T2 19TB 异地冷备: </tspan><tspan class="i-desc">每日 03:30 导出 pg_dump + SQLite 快照并校验 SHA256 (盘占 7.98%)</tspan></text>
  </g>
  <!-- Card: 二、中间件与前端技术栈定量选型裁决 -->
  <g transform="translate(814, 130)">
    <rect width="726" height="371" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#softCardShadow)"/>
    <path d="M 0 12 Q 0 0 12 0 L 714 0 Q 726 0 726 12 L 726 62 L 0 62 Z" fill="#f2f9f7"/>
    <line x1="0" y1="62" x2="726" y2="62" stroke="#059669" stroke-width="1" stroke-opacity="0.3"/>
    <text x="24" y="27" class="c-title">二、中间件与前端技术栈定量选型裁决</text>
    <text x="24" y="47" class="c-subtitle">Why Modular Monolith + Vue 3 Beats Java Microservices on 1.7GiB RAM</text>
    <rect x="536" y="17" width="170" height="26" rx="13" fill="#e1f2ed"/>
    <text x="621" y="34" text-anchor="middle" class="badge-t" fill="#036949">模块 2 · 技术栈裁决</text>
    <rect x="20" y="74" width="686" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="36" y="92" class="m-lbl">后端架构评分对比</text>
    <text x="36" y="118" class="m-val" fill="#059669">88.85 (模块化单体) vs 42.90</text>
    <line x1="363" y1="82" x2="363" y2="128" stroke="#e2e8f0" stroke-width="1"/>
    <text x="379" y="92" class="m-lbl">前端架构评分对比</text>
    <text x="379" y="118" class="m-val" fill="#059669">92.30 (Vue 3) vs 75.95</text>
    <circle cx="32" cy="152" r="4" fill="#059669"/>
    <text x="46" y="156"><tspan class="i-pfx">1.7GiB 内存硬边界: </tspan><tspan class="i-desc">Java 微服务需 3.2~5.5GiB 必触发 OOM；当前整机仅用 512MiB</tspan></text>
    <circle cx="32" cy="198" r="4" fill="#059669"/>
    <text x="46" y="202"><tspan class="i-pfx">Python 3.14 模块化单体: </tspan><tspan class="i-desc">仅占 28MiB RSS，完整保留 Windows git push &lt;=3.0s 极速发布</tspan></text>
    <circle cx="32" cy="244" r="4" fill="#059669"/>
    <text x="46" y="248"><tspan class="i-pfx">Spring Boot 3.4 蓝图: </tspan><tspan class="i-desc">已固化 1:1 注解与实体映射契约，未来 &gt;16GB 集群可零重构平移</tspan></text>
    <circle cx="32" cy="290" r="4" fill="#059669"/>
    <text x="46" y="294"><tspan class="i-pfx">Vue 3 响应式架构: </tspan><tspan class="i-desc">KaoyanReactiveStore Proxy 细粒度更新，划词高亮零全树重绘</tspan></text>
  </g>
  <!-- Card: 三、十二阶工业级软件工程设计体系 -->
  <g transform="translate(60, 529)">
    <rect width="726" height="371" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.5" filter="url(#softCardShadow)"/>
    <path d="M 0 12 Q 0 0 12 0 L 714 0 Q 726 0 726 12 L 726 62 L 0 62 Z" fill="#fdf8f2"/>
    <line x1="0" y1="62" x2="726" y2="62" stroke="#d97706" stroke-width="1" stroke-opacity="0.3"/>
    <text x="24" y="27" class="c-title">三、十二阶工业级软件工程设计体系</text>
    <text x="24" y="47" class="c-subtitle">6 User-Specified Stages + 6 Architect-Added Engineering Stages</text>
    <rect x="536" y="17" width="170" height="26" rx="13" fill="#faeee1"/>
    <text x="621" y="34" text-anchor="middle" class="badge-t" fill="#975304">模块 3 · 十二阶设计</text>
    <rect x="20" y="74" width="686" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="36" y="92" class="m-lbl">工程设计覆盖阶数</text>
    <text x="36" y="118" class="m-val" fill="#d97706">12 阶全闭环 (6+6)</text>
    <line x1="363" y1="82" x2="363" y2="128" stroke="#e2e8f0" stroke-width="1"/>
    <text x="379" y="92" class="m-lbl">公理与追溯覆盖率</text>
    <text x="379" y="118" class="m-val" fill="#d97706">5 条公理 · 100% RTM</text>
    <circle cx="32" cy="152" r="4" fill="#d97706"/>
    <text x="46" y="156"><tspan class="i-pfx">需求与契约层 (①~③): </tspan><tspan class="i-desc">① 语义单 (SRS-MSU) -&gt; ② 分片 PRD -&gt; ③ 本体四元组与 5 条公理</tspan></text>
    <circle cx="32" cy="198" r="4" fill="#d97706"/>
    <text x="46" y="202"><tspan class="i-pfx">架构与数据层 (④~⑥): </tspan><tspan class="i-desc">④ 概要设计 (HLD) -&gt; ⑤ PG18+SQLite 10表设计 -&gt; ⑥ 详细设计 (LLD)</tspan></text>
    <circle cx="32" cy="244" r="4" fill="#d97706"/>
    <text x="46" y="248"><tspan class="i-pfx">算法与防御层 (⑦~⑩): </tspan><tspan class="i-desc">⑦ 双写与艾宾浩斯伪码 -&gt; ⑧ RBAC 与幂等 -&gt; ⑨ 三模态 -&gt; ⑩ RTM</tspan></text>
    <circle cx="32" cy="290" r="4" fill="#d97706"/>
    <text x="46" y="294"><tspan class="i-pfx">验证与交付层 (⑪~⑫): </tspan><tspan class="i-desc">⑪ 24 项四维正交测试用例矩阵 -&gt; ⑫ Phase 1~5 实施与验收报告</tspan></text>
  </g>
  <!-- Card: 四、五阶段审慎实施与 24 项真机测试验收 -->
  <g transform="translate(814, 529)">
    <rect width="726" height="371" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#softCardShadow)"/>
    <path d="M 0 12 Q 0 0 12 0 L 714 0 Q 726 0 726 12 L 726 62 L 0 62 Z" fill="#f8f5fe"/>
    <line x1="0" y1="62" x2="726" y2="62" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.3"/>
    <text x="24" y="27" class="c-title">四、五阶段审慎实施与 24 项真机测试验收</text>
    <text x="24" y="47" class="c-subtitle">24/24 Automated Tests Passed Against https://kaoyan.8.163.29.42.nip.io</text>
    <rect x="548" y="17" width="158" height="26" rx="13" fill="#efe7fc"/>
    <text x="627" y="34" text-anchor="middle" class="badge-t" fill="#5628a5">模块 4 · 真机验收</text>
    <rect x="20" y="74" width="686" height="62" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="36" y="92" class="m-lbl">自动化验收通过率</text>
    <text x="36" y="118" class="m-val" fill="#7c3aed">24 / 24 (100.0% PASS)</text>
    <line x1="363" y1="82" x2="363" y2="128" stroke="#e2e8f0" stroke-width="1"/>
    <text x="379" y="92" class="m-lbl">完备证据链编号</text>
    <text x="379" y="118" class="m-val" fill="#7c3aed">ev:ev-0036 ~ ev:ev-0054</text>
    <circle cx="32" cy="152" r="4" fill="#7c3aed"/>
    <text x="46" y="156"><tspan class="i-pfx">Happy Path (TC-01~08): </tspan><tspan class="i-desc">PG18 双写、学籍登录、真题入库、艾宾浩斯查词、批注升格全绿</tspan></text>
    <circle cx="32" cy="198" r="4" fill="#7c3aed"/>
    <text x="46" y="202"><tspan class="i-pfx">Boundary (TC-09~14): </tspan><tspan class="i-desc">段落锚点 [0,200] 极值放行、201 越界/短文本/非法词根返回 422</tspan></text>
    <circle cx="32" cy="244" r="4" fill="#7c3aed"/>
    <text x="46" y="248"><tspan class="i-pfx">HA &amp; Idempotency (15~19): </tspan><tspan class="i-desc">PG 宕机 &lt;5ms 切 SQLite WAL + 自动追平 + 幂等防重 (200/409)</tspan></text>
    <circle cx="32" cy="290" r="4" fill="#7c3aed"/>
    <text x="46" y="294"><tspan class="i-pfx">Security &amp; Ops (TC-20~24): </tspan><tspan class="i-desc">访客写 401 阻断、扫描器 /.env /db_dump.sql 404、T2 双归档</tspan></text>
  </g>
</svg>